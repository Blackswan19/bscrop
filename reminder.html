<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BsReminder</title> <link rel="icon" type="image/x-icon" href="https://i.ibb.co/WBcSJPd/New-Project-A1-A7313.png"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap'); * { color: #fff;font-family: 'Poppins', sans-serif; margin: 0; padding: 0; scrollbar-width:thin;letter-spacing:0.3px;} body { background: #000; -webkit-tap-highlight-color: transparent; user-select: none;overflow: hidden; scrollbar-color: gray transparent; } * { -webkit-tap-highlight-color: transparent; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } .header { position: fixed; top: 0; left: 0; right: 0; background: #000; z-index: 100; padding: 15px 10px; display: flex; justify-content: space-between; align-items: center; } .app-title { color: #0049ff; font-weight: 600; font-size: 25px; } .header-buttons button { padding: 0; margin: 0; background: rgb(255 255 255 / 20%); color: white; border-radius: 999px; text-decoration: none; font-size: 15px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; } .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 13px; color: #aaa; padding: 13px 0 6px 0; position: fixed; top: 40px; left: 0; right: 0;display: none; background: #000; z-index: 99; } .calendar-container { padding-top: 50px; overflow-y: auto; height: 100vh; } .notes-list-content h2 { color: white; font-size: 20px; font-weight: 500; text-align: start; } label { font-weight: 300; } .month-section { padding: 10px; display: flex; justify-content: center; align-items: center; flex-direction: column; } .header-buttons { display: flex; justify-content: center; align-items: center; gap: 10px; } .month-header { font-size: 17px; font-weight: 500; padding: 10px; position: sticky; top: 10px; z-index: 999999; width: 94%; color: #b1b1b1; box-shadow: 0px 0px 8px rgb(0 0 0 / 21%); background: rgb(255 255 255 / 10%); backdrop-filter: blur(30px); border: 0.5px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; text-align: center; margin: 10px; max-width: 500px; } .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #0a0a0a; border-radius: 20px; overflow: scroll; scrollbar-width: none; width: 100%; max-width: 550px; } .day-header { background: #3e3e3e; padding: 10px 4px; text-align: center; font-size: 13px; color: #888; position: sticky; top: 0; left: 0; } .day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 15px; cursor: pointer; transition: all 0.2s; background: #111111; } .day:hover { background: #3e3e3e; } .day.today .day-number { background: #3e3e3e; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; } .note-preview { font-size: 10px; line-height: 1.2; text-align: center; margin-top: 4px; width: 100%;display: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 10px; } .pinned { background: #ff8c0088 !important; } .goal { background: #1800ff88 !important; } /* Modals */ .modal, #notesListModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgb(0 0 0 / 85%); z-index: 10000000000; width: 100%;justify-content: center; width: 100%; align-items: center; } .modal-content, .notes-list-content { text-align: center; width: 85%; max-width: 400px; padding: 15px; background: #1c1c1e; border-radius: 35px; border: 0.5px solid rgba(255, 255, 255, 0.1); } .modal-content h3 { color: white; font-size: 20px; font-weight: 500; text-align: center; } .notes-list-content { max-width: 600px; width: 100%; padding: 60px 0; display: flex; justify-content: center; align-items: center; flex-direction: column; border: none; background: transparent; }div#notesList { width: 95%; max-width: 400px; } input{ padding: 12px 15px; margin: 10px 0; border-radius: 999px; border: none; width: stretch; font-size: 17px; font-weight: 400; text-align: center; outline: none; color: #ffffffdb; } button { padding: 11px 15px; border-radius: 999px; border: none; width: stretch; font-size: 16px; font-weight: 400; text-align: center; outline: none; color: #ffffffdb; margin: 0; } input { background: #323232;} button { background: #002aff;} .close { font-size: 35px; cursor: pointer; float: right; position: absolute; top: 15px; right: 10px; width: 40px; height: 40px; border-radius: 50%; background: #1c1c1e; color: white; display: flex; justify-content: center; align-items: center; font-weight: 100; } .note-item { background: #1a1a1a; padding: 10px 0; border-radius: 25px; margin-bottom: 10px; cursor: pointer; width: 100%; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; } .empty-state { text-align: center; color: #666; padding: 60px 20px; } </style> </head> <body> <div class="header"> <div class="app-title">BsReminder</div> <div class="header-buttons"> <button onclick="toggleNotesList()"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M290-410v-60h380v60H290Zm0 160v-60h260v60H290Zm-77.69 150Q182-100 161-121q-21-21-21-51.31v-535.38Q140-738 161-759q21-21 51.31-21h55.38v-84.61h61.54V-780h303.08v-84.61h60V-780h55.38Q778-780 799-759q21 21 21 51.31v535.38Q820-142 799-121q-21 21-51.31 21H212.31Zm0-60h535.38q4.62 0 8.46-3.85 3.85-3.84 3.85-8.46v-375.38H200v375.38q0 4.62 3.85 8.46 3.84 3.85 8.46 3.85Z"/></svg> </button> <a href="https://blackswan19.github.io/bscrop/termsofuse" style="background: blue; color: white; border-radius: 999px; text-decoration: none; font-size: 15px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#e3e3e3"><path d="M10.95,13.07L9.36,11.47q-0.22-0.22-0.52-0.23T8.3,11.47T8.07,12.01T8.3,12.54l2.01,2.03q0.27,0.27 0.63,0.27t0.63-0.27l4.14-4.14q0.22-0.22 0.23-0.53T15.73,9.36T15.19,9.13T14.66,9.36l-3.71,3.71Zm0.74,8.28q-0.15-0.02-0.29-0.07q-3.16-1.13-5.03-3.99T4.5,11.1V6.6q0-0.57 0.33-1.02T5.68,4.91l5.69-2.12Q11.69,2.67 12,2.67t0.63,0.12l5.69,2.12q0.52,0.21 0.85,0.66T19.5,6.6v4.5q0,3.32-1.87,6.18T12.6,21.27q-0.14,0.05-0.29,0.07T12,21.37t-0.31-0.02Z"/></svg> </a> </div> </div> <div class="weekdays"> <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div> <div>Thu</div><div>Fri</div><div>Sat</div> </div> <div class="calendar-container" id="calendarContainer"></div> <!-- All Notes --> <div id="notesListModal"> <div class="notes-list-content"> <div style="margin-bottom:20px;"> <h2>All Notes <span class="close" onclick="closeNotesList()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-437.85 277.08-234.92q-8.31 8.3-20.89 8.5-12.57.19-21.27-8.5-8.69-8.7-8.69-21.08 0-12.38 8.69-21.08L437.85-480 234.92-682.92q-8.3-8.31-8.5-20.89-.19-12.57 8.5-21.27 8.7-8.69 21.08-8.69 12.38 0 21.08 8.69L480-522.15l202.92-202.93q8.31-8.3 20.89-8.5 12.57-.19 21.27 8.5 8.69 8.7 8.69 21.08 0 12.38-8.69 21.08L522.15-480l202.93 202.92q8.3 8.31 8.5 20.89.19 12.57-8.5 21.27-8.7 8.69-21.08 8.69-12.38 0-21.08-8.69L480-437.85Z"/></svg></span></h2> </div> <div id="notesList"></div> </div> </div> <!-- Add/Edit Note --> <div id="noteModal" class="modal"> <div class="modal-content"> <span class="close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-437.85 277.08-234.92q-8.31 8.3-20.89 8.5-12.57.19-21.27-8.5-8.69-8.7-8.69-21.08 0-12.38 8.69-21.08L437.85-480 234.92-682.92q-8.3-8.31-8.5-20.89-.19-12.57 8.5-21.27 8.7-8.69 21.08-8.69 12.38 0 21.08 8.69L480-522.15l202.92-202.93q8.31-8.3 20.89-8.5 12.57-.19 21.27 8.5 8.69 8.7 8.69 21.08 0 12.38-8.69 21.08L522.15-480l202.93 202.92q8.3 8.31 8.5 20.89.19 12.57-8.5 21.27-8.7 8.69-21.08 8.69-12.38 0-21.08-8.69L480-437.85Z"/></svg></span> <h3 id="modalDate"></h3> <div id="titleField" style="display:none;"> <input type="text" id="noteTitle" placeholder="Title for pinned note" /> </div> <input type="text" id="noteText" placeholder="Write your note here..." /> <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; justify-content: flex-start; margin-bottom: 10px; "> <input type="checkbox" id="pinForever" style=" outline: none; border: none; width: 15px; height: 15px; "> <label for="pinForever">Pin to every month on this date</label> </div> <button onclick="saveNote()">Save Note</button> </div> </div> <!-- View Note --> <div id="viewModal" class="modal"> <div class="modal-content"> <span class="close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-437.85 277.08-234.92q-8.31 8.3-20.89 8.5-12.57.19-21.27-8.5-8.69-8.7-8.69-21.08 0-12.38 8.69-21.08L437.85-480 234.92-682.92q-8.3-8.31-8.5-20.89-.19-12.57 8.5-21.27 8.7-8.69 21.08-8.69 12.38 0 21.08 8.69L480-522.15l202.92-202.93q8.31-8.3 20.89-8.5 12.57-.19 21.27 8.5 8.69 8.7 8.69 21.08 0 12.38-8.69 21.08L522.15-480l202.93 202.92q8.3 8.31 8.5 20.89.19 12.57-8.5 21.27-8.7 8.69-21.08 8.69-12.38 0-21.08-8.69L480-437.85Z"/></svg></span> <h3 id="viewTitle"></h3> <p id="viewText" style=" font-size: 17px; white-space: pre-wrap; margin: 10px 0; border: solid 1px #ffffff3d; border-radius: 99px; padding: 12px;"></p> <button onclick="editNote()">Edit Note</button> </div> </div>
<script>
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    
    let today = new Date();
    let currentYear = today.getFullYear();

    let oneTimeNotes = JSON.parse(localStorage.getItem('oneTimeNotes') || '{}');
    let pinnedNotes  = JSON.parse(localStorage.getItem('pinnedNotes') || '{}');
    document.addEventListener('contextmenu', e => e.preventDefault());
    let selectedDate = "";
    let selectedDay = 0;

    function saveToStorage() {
        localStorage.setItem('oneTimeNotes', JSON.stringify(oneTimeNotes));
        localStorage.setItem('pinnedNotes', JSON.stringify(pinnedNotes));
    }

    function migratePinnedNotes() {
        Object.keys(pinnedNotes).forEach(key => {
            if (key.includes('-')) {
                const day = parseInt(key.split('-')[2]);
                pinnedNotes[day] = pinnedNotes[key];
                delete pinnedNotes[key];
            }
        });
        saveToStorage();
    }

    function createMonthElement(year, month) {
        const section = document.createElement('div');
        section.className = 'month-section';

        const header = document.createElement('div');
        header.className = 'month-header';
        header.textContent = `${months[month]} ${year}`;
        section.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        ['S','M','T','W','T','F','S'].forEach(d => {
            const el = document.createElement('div');
            el.className = 'day-header';
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'day';
            empty.style.visibility = 'hidden';
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const fullDate = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            
            const cell = document.createElement('div');
            cell.className = 'day';
            cell.dataset.date = fullDate;
            cell.dataset.day = day;

            if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                cell.classList.add('today');
            }

            const num = document.createElement('div');
            num.className = 'day-number';
            num.textContent = day;
            cell.appendChild(num);

            const pinned = pinnedNotes[day];
            if (pinned && pinned.note && pinned.note.trim() !== "") {
                cell.classList.add('pinned');
                const p = document.createElement('div');
                p.className = 'note-preview';
                p.textContent = pinned.title ? pinned.title : pinned.note.substring(0, 18) + "…";
                cell.appendChild(p);
            }

            if (oneTimeNotes[fullDate] && oneTimeNotes[fullDate].trim() !== "") {
                cell.classList.add('goal');
                const p = document.createElement('div');
                p.className = 'note-preview';
                p.textContent = oneTimeNotes[fullDate].substring(0, 15) + "…";
                cell.appendChild(p);
            }

            cell.addEventListener('click', () => handleDayClick(fullDate, day));
            grid.appendChild(cell);
        }

        section.appendChild(grid);
        return section;
    }

    function handleDayClick(fullDate, day) {
        selectedDate = fullDate;
        selectedDay = day;

        const pinned = pinnedNotes[day];
        const oneTime = oneTimeNotes[fullDate];

        const hasPinned = pinned && pinned.note && pinned.note.trim() !== "";
        const hasOneTime = oneTime && oneTime.trim() !== "";

        if (hasPinned || hasOneTime) {
            document.getElementById("viewTitle").textContent = hasPinned ? (pinned.title || "Pinned Note") : "New Note";
            document.getElementById("viewText").textContent = hasPinned ? pinned.note : oneTime;
            document.getElementById("viewModal").style.display = "flex";
        } else {
            openNoteModal(fullDate, day);
        }
    }

    function openNoteModal(fullDate, day) {
        selectedDate = fullDate;
        selectedDay = day;

        document.getElementById("modalDate").textContent = fullDate;
        const isPinned = !!(pinnedNotes[day] && pinnedNotes[day].note && pinnedNotes[day].note.trim() !== "");

        document.getElementById("pinForever").checked = isPinned;
        document.getElementById("titleField").style.display = isPinned ? "block" : "none";

        document.getElementById("noteTitle").value = isPinned ? (pinnedNotes[day].title || "") : "";
        document.getElementById("noteText").value = isPinned ? pinnedNotes[day].note : (oneTimeNotes[fullDate] || "");

        document.getElementById("noteModal").style.display = "flex";
    }

    function saveNote() {
        let text = document.getElementById("noteText").value.trim();
        const title = document.getElementById("noteTitle").value.trim();
        const forever = document.getElementById("pinForever").checked;

        if (!text) {
            if (forever) delete pinnedNotes[selectedDay];
            else delete oneTimeNotes[selectedDate];
            saveToStorage();
            closeModal();
            refreshCalendar();
            refreshNotesList();
            return;
        }

        if (forever) {
            pinnedNotes[selectedDay] = { title: title || "", note: text };
            delete oneTimeNotes[selectedDate];
        } else {
            oneTimeNotes[selectedDate] = text;
            delete pinnedNotes[selectedDay];
        }

        saveToStorage();
        closeModal();
        refreshCalendar();
        refreshNotesList();
    }

    function editNote() {
        closeModal();
        openNoteModal(selectedDate, selectedDay);
    }

    function closeModal() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = "none");
    }

    function refreshCalendar() {
        const container = document.getElementById("calendarContainer");
        container.innerHTML = "";
        
        const startYear = currentYear - 2;
        for (let y = startYear; y <= currentYear + 1; y++) {
            for (let m = 0; m < 12; m++) {
                container.appendChild(createMonthElement(y, m));
            }
        }
    }

    function toggleNotesList() {
        document.getElementById("notesListModal").style.display = "block";
        refreshNotesList();
    }

    function closeNotesList() {
        document.getElementById("notesListModal").style.display = "none";
    }

    function refreshNotesList() {
        const container = document.getElementById("notesList");
        container.innerHTML = "";

        let notesArray = [];

        Object.keys(pinnedNotes).forEach(day => {
            const pinned = pinnedNotes[day];
            if (pinned && pinned.note && pinned.note.trim() !== "") {
                notesArray.push({
                    type: "pinned",
                    dateStr: `Every ${day}${getOrdinal(day)}`,
                    title: pinned.title || "",
                    text: pinned.note,
                    day: parseInt(day)
                });
            }
        });

        Object.keys(oneTimeNotes).sort().forEach(date => {
            const text = oneTimeNotes[date];
            if (text && text.trim() !== "") {
                notesArray.push({
                    type: "onetime",
                    dateStr: date,
                    title: "",
                    text: text
                });
            }
        });

        if (notesArray.length === 0) {
            container.innerHTML = `<div class="empty-state">No notes yet.<br>Tap any date on the calendar.</div>`;
            return;
        }

        notesArray.forEach(note => {
            const div = document.createElement('div');
            div.className = 'note-item';
            div.innerHTML = `
                <div style="    color: #00eaff;font-size: 15px;">${note.dateStr}</div>
                ${note.type === "pinned" ? `<div style="font-weight:600; margin:6px 0;">⭐ ${note.title || "Pinned Note"}</div>` : ''}
                <div style="    font-size: 17px;
    line-height: 1.4;
    width: 95%;
    text-align: center;">${note.text}</div>
            `;
            div.onclick = () => {
                closeNotesList();
                if (note.type === "pinned") {
                    selectedDay = note.day;
                    selectedDate = `${currentYear}-01-${String(note.day).padStart(2,'0')}`;
                    document.getElementById("viewTitle").textContent = note.title || "Pinned Note";
                    document.getElementById("viewText").textContent = note.text;
                    document.getElementById("viewModal").style.display = "flex";
                } else {
                    selectedDate = note.dateStr;
                    selectedDay = parseInt(note.dateStr.split('-')[2]);
                    openNoteModal(selectedDate, selectedDay);
                }
            };
            container.appendChild(div);
        });
    }

    function getOrdinal(n) {
        const s = ["th","st","nd","rd"];
        const v = n % 100;
        return s[(v-20)%10] || s[v] || s[0];
    }

    window.onclick = e => {
        if (e.target.id === "notesListModal") closeNotesList();
        if (e.target.classList.contains('modal')) closeModal();
    };

    document.addEventListener("DOMContentLoaded", () => {
        migratePinnedNotes();
        refreshCalendar();
        
        setTimeout(() => {
            const current = Array.from(document.querySelectorAll('.month-header'))
                .find(h => h.textContent.includes(months[today.getMonth()]) && 
                           h.textContent.includes(today.getFullYear().toString()));
            if (current) current.scrollIntoView({ behavior: "smooth" });
        }, 100);
    });
</script>
</body>
</html>
