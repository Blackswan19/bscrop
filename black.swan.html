<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Welcome to Black Swan</title> <link rel="icon" type="image/x-icon" href="https://i.ibb.co/27GXWVgg/BS.png"> <style> /* ========================================================= RESET ========================================================= */ * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } html, body { width: 100%; height: 100%; overflow: hidden; } html { scrollbar-width: none; } html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; } body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; position: relative; color: #fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif; background:black; user-select: none; isolation: isolate; } /* ========================================================= CINEMATIC BACKGROUND ========================================================= */ .background { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -10; background: radial-gradient(#0500ff, transparent 70%) } /* Large ambient glow */ .glow { position: absolute; width: min(650px, 90vw); height: min(650px, 90vw); left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient( circle, rgba(65, 55, 255, .32) 0%, rgba(30, 20, 160, .18) 30%, transparent 70% ); filter: blur(55px); animation: glowMove 8s ease-in-out infinite, glowPulse 5s ease-in-out infinite; } .glow-two { position: absolute; width: 280px; height: 280px; left: 12%; top: 15%; border-radius: 50%; background: radial-gradient( circle, rgba(100, 90, 255, .14), transparent 70% ); filter: blur(45px); animation: floatingGlow 11s ease-in-out infinite; } .glow-three { position: absolute; width: 350px; height: 350px; right: 5%; bottom: 0; border-radius: 50%; background: radial-gradient( circle, rgba(40, 50, 180, .12), transparent 70% ); filter: blur(55px); animation: floatingGlowReverse 13s ease-in-out infinite; } /* ========================================================= PREMIUM GRID ========================================================= */ .grid { position: absolute; inset: -50%; opacity: .13; background-image: linear-gradient( rgba(255,255,255,.035) 1px, transparent 1px ), linear-gradient( 90deg, rgba(255,255,255,.035) 1px, transparent 1px ); background-size: 70px 70px; transform: perspective(500px) rotateX(65deg) translateY(20%); mask-image: linear-gradient( to bottom, transparent, black 30%, black 70%, transparent ); animation: gridMove 18s linear infinite; } /* ========================================================= VIGNETTE ========================================================= */ .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; box-shadow: inset 0 0 180px rgba(0,0,0,.95), inset 0 0 50px rgba(0,0,0,.75); } /* ========================================================= FILM GRAIN ========================================================= */ .grain { position: fixed; inset: -50%; z-index: 6; pointer-events: none; opacity: .055; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); animation: grainMove .25s steps(2) infinite; } /* ========================================================= LIGHT ORB ========================================================= */ .orb { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: white; box-shadow: 0 0 10px rgba(255,255,255,.9), 0 0 25px rgba(100,90,255,.7); opacity: .65; animation: orbFloat 8s linear infinite; } .orb:nth-child(1) { left: 8%; animation-duration: 10s; } .orb:nth-child(2) { left: 21%; animation-duration: 13s; animation-delay: 2s; } .orb:nth-child(3) { left: 36%; animation-duration: 9s; animation-delay: 4s; } .orb:nth-child(4) { left: 52%; animation-duration: 12s; animation-delay: 1s; } .orb:nth-child(5) { left: 69%; animation-duration: 10s; animation-delay: 3s; } .orb:nth-child(6) { left: 83%; animation-duration: 14s; animation-delay: 5s; } .orb:nth-child(7) { left: 94%; animation-duration: 11s; animation-delay: 2s; } /* ========================================================= TOP BRAND MARK ========================================================= */ .brand-mark { position: fixed; top: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 10; opacity: 0; animation: brandReveal 1.2s cubic-bezier(.2,.8,.2,1) .3s forwards; } .brand-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff, 0 0 25px rgba(80,70,255,.9); animation: dotPulse 2.5s ease-in-out infinite; } .brand-name { font-size: 10px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; color: rgba(255,255,255,.68); } /* ========================================================= MAIN ========================================================= */ .welcome-container { width: 100%; padding: 30px; position: relative; text-align: center; z-index: 3; } /* ========================================================= SMALL TOP LABEL ========================================================= */ .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 25px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.035); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; opacity: 0; animation: fadeUp 1s cubic-bezier(.2,.8,.2,1) .15s forwards; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 40px rgba(0,0,0,.25); } .eyebrow span { width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.9); animation: dotPulse 2s ease-in-out infinite; } /* ========================================================= WELCOME TEXT ========================================================= */ #welcomeText { min-height: 90px; padding: 0; font-size: clamp(32px, 7vw, 76px); line-height: 1.05; font-weight: 700; letter-spacing: -2.5px; color: #fff; opacity: 0; white-space: nowrap; word-break: break-word; text-shadow: 0 0 15px rgba(255,255,255,.08), 0 0 50px rgba(80,70,255,.12); background: linear-gradient( 180deg, #fff 0%, #e8e8ef 45%, #8f8f9e 100% ); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; } /* ========================================================= LANGUAGE ========================================================= */ #language { margin-top: 15px; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; color: #ffffffcf; min-height: 0; font-weight: 400; } /* ========================================================= DECORATIVE LINE ========================================================= */ .line-wrapper { display: flex; align-items: center; justify-content: center; gap: 12px; margin: clamp(20px, 4vw, 32px) auto; } .line { width: clamp(45px, 10vw, 100px); height: 1px; background: linear-gradient( 90deg, transparent, rgba(255,255,255,.7) ); animation: lineExpand 1.5s ease forwards; } .line.right { background: linear-gradient( 90deg, rgba(255,255,255,.7), transparent ); } .diamond { width: 4px; height: 4px; transform: rotate(45deg); background: white; box-shadow: 0 0 10px rgba(255,255,255,.7); } /* ========================================================= ENTER BUTTON ========================================================= */ .frombs-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 135px; padding: 15px; margin-top: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.20); color: #fff; background: linear-gradient( 145deg, rgba(255,255,255,.11), rgba(255,255,255,.025) ); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.4), 0 15px 45px rgba(0,0,0,.35); cursor: pointer; overflow: hidden; opacity: 0; animation: buttonReveal 1s cubic-bezier(.2,.8,.2,1) .8s forwards; transition: transform .45s cubic-bezier(.2,.8,.2,1), border-color .35s ease, box-shadow .35s ease; } .frombs-btn::before { content: ""; position: absolute; top: 0; left: -120%; width: 80%; height: 100%; /* background: linear-gradient( 100deg, transparent, rgba(255,255,255,.20), transparent ); */ transform: skewX(-20deg); transition: left .8s ease; } .frombs-btn::after { content: ""; position: absolute; inset: 1px; border-radius: inherit; border: 1.5px solid rgba(255,255,255,.035); pointer-events: none; } .frombs-btn:hover { transform: translateY(-4px) scale(1.025); } .frombs-btn:hover::before { left: 140%; } .frombs-btn:active { transform: translateY(0) scale(.96); } .button-content { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; } .button-arrow { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.08); font-size: 12px; transition: transform .35s ease, background .35s ease; } .frombs-btn:hover .button-arrow { transform: translateX(4px); background: rgba(255,255,255,.16); } .frombs-btn span { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; } /* ========================================================= SERVICE OVERLAY ========================================================= */ .service-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; background: radial-gradient( circle at 50% 50%, rgba(45,35,120,.16), rgba(0,0,0,.82) 60% ); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility .5s ease; } .service-overlay.active { opacity: 1; visibility: visible; } /* ========================================================= MODAL ========================================================= */ .service-box { width: min(430px, 94vw); position: relative; padding: 28px; overflow: hidden; border-radius: 32px; border: 1px solid rgba(255,255,255,.13); background: linear-gradient( 145deg, rgba(35,35,45,.82), rgba(5,5,10,.94) ); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); box-shadow: 0 40px 120px rgba(0,0,0,.75), 0 0 80px rgba(55,45,220,.12), inset 0 1px 0 rgba(255,255,255,.09); transform: translateY(35px) scale(.90) rotateX(5deg); transition: transform .7s cubic-bezier(.16,1,.3,1); } .service-box::before { content: ""; position: absolute; width: 250px; height: 250px; left: 50%; top: -150px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient( circle, rgba(75,65,255,.18), transparent 70% ); filter: blur(25px); pointer-events: none; } .service-overlay.active .service-box { transform: translateY(0) scale(1) rotateX(0); } /* ========================================================= MODAL HEADER ========================================================= */ .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; } .modal-brand { display: flex; align-items: center; gap: 10px; } .modal-logo { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: linear-gradient( 145deg, rgba(255,255,255,.12), rgba(255,255,255,.025) ); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.3); font-size: 14px; font-weight: 700; } .modal-brand-text { text-align: left; } .service-title { font-size: 17px; font-weight: 700; letter-spacing: -.3px; } .service-subtitle { margin-top: 3px; font-size: 10px; color: rgba(255,255,255,.38); letter-spacing: 1px; text-transform: uppercase; } /* ========================================================= CLOSE ========================================================= */ .close-service { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.035); color: rgba(255,255,255,.65); font-size: 14px; cursor: pointer; transition: transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease, color .3s ease; } .close-service:hover { transform: rotate(90deg) scale(1.08); color: white; background: rgba(255,255,255,.10); } .close-service:active { transform: rotate(90deg) scale(.90); } /* ========================================================= OPTIONS ========================================================= */ .service-options { display: flex; flex-direction: column; gap: 11px; } .service-option { width: 100%; min-height: 70px; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 13px; border-radius: 20px; border: 1px solid rgba(255,255,255,.075); background: linear-gradient( 145deg, rgba(255,255,255,.065), rgba(255,255,255,.018) ); color: white; text-decoration: none; text-align: left; cursor: pointer; overflow: hidden; transition: transform .4s cubic-bezier(.2,.8,.2,1), background .3s ease, border-color .3s ease, box-shadow .3s ease; } .service-option::before { content: ""; position: absolute; inset: 0; background: linear-gradient( 110deg, transparent 20%, rgba(255,255,255,.06), transparent 80% ); transform: translateX(-100%); transition: transform .7s ease; } .service-option:hover { transform: translateY(-3px) scale(1.012); background: linear-gradient( 145deg, rgba(255,255,255,.105), rgba(255,255,255,.025) ); border-color: rgba(255,255,255,.18); box-shadow: 0 15px 35px rgba(0,0,0,.25); } .service-option:hover::before { transform: translateX(100%); } .service-option:active { transform: scale(.975); } .option-left { display: flex; align-items: center; gap: 13px; position: relative; z-index: 1; } .option-icon { width: 43px; height: 43px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 1px solid rgba(100,90,255,.18); background: linear-gradient( 145deg, rgba(65,55,255,.22), rgba(30,20,130,.08) ); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); font-size: 15px; transition: transform .4s cubic-bezier(.2,.8,.2,1); } .service-option:hover .option-icon { transform: scale(1.08) rotate(-3deg); } .option-name { font-size: 14px; font-weight: 650; letter-spacing: -.1px; } .option-description { margin-top: 4px; font-size: 10px; color: rgba(255,255,255,.35); } .arrow { position: relative; z-index: 1; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.045); color: rgba(255,255,255,.45); font-size: 14px; transition: transform .35s ease, color .3s ease, background .3s ease; } .service-option:hover .arrow { transform: translateX(4px); color: white; background: rgba(255,255,255,.10); } /* Disabled */ #accessOption { opacity: .42 !important; cursor: not-allowed; filter: saturate(.3); } #accessOption:hover { transform: none; border-color: rgba(255,255,255,.075); box-shadow: none; } /* ========================================================= ANIMATIONS ========================================================= */ @keyframes fadeUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } } @keyframes buttonReveal { from { opacity: 0; transform: translateY(25px) scale(.92); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes brandReveal { from { opacity: 0; transform: translateX(-50%) translateY(-15px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } } @keyframes glowPulse { 0%, 100% { opacity: .35; } 50% { opacity: .75; } } @keyframes glowMove { 0%, 100% { transform: translate(-50%, -50%) scale(.88); } 50% { transform: translate(-50%, -50%) scale(1.12); } } @keyframes floatingGlow { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(80px,60px); } } @keyframes floatingGlowReverse { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-70px,-50px); } } @keyframes gridMove { from { transform: perspective(500px) rotateX(65deg) translateY(20%) translateX(0); } to { transform: perspective(500px) rotateX(65deg) translateY(20%) translateX(70px); } } @keyframes grainMove { 0% { transform: translate(0,0); } 25% { transform: translate(3%,-2%); } 50% { transform: translate(-2%,3%); } 75% { transform: translate(2%,2%); } 100% { transform: translate(-3%,-3%); } } @keyframes orbFloat { 0% { bottom: -10px; transform: translateX(0) scale(.5); opacity: 0; } 10% { opacity: .5; } 50% { transform: translateX(70px) scale(1); } 90% { opacity: .15; } 100% { bottom: 110vh; transform: translateX(-50px) scale(.2); opacity: 0; } } @keyframes dotPulse { 0%, 100% { opacity: .45; box-shadow: 0 0 5px rgba(255,255,255,.4); } 50% { opacity: 1; box-shadow: 0 0 12px rgba(255,255,255,1), 0 0 25px rgba(80,70,255,.7); } } @keyframes lineExpand { from { width: 0; opacity: 0; } to { opacity: 1; } } /* ========================================================= LANGUAGE TRANSITIONS ========================================================= */ .show { animation: textIn .9s cubic-bezier(.2,.8,.2,1) forwards; } .hide { animation: textOut .5s cubic-bezier(.4,0,1,1) forwards; } @keyframes textIn { from { opacity: 0; transform: translateY(25px) scale(.96); filter: blur(8px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } } @keyframes textOut { from { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } to { opacity: 0; transform: translateY(-22px) scale(1.025); filter: blur(8px); } } /* ========================================================= RESPONSIVE ========================================================= */ @media (max-width: 600px) { .welcome-container { padding: 0px; } #welcomeText { font-size: clamp(28px, 8.5vw, 48px); letter-spacing: -1.5px; min-height: 60px; } #language { font-size: 8px; letter-spacing: 4px; } .brand-mark { top: 20px; } .brand-name { letter-spacing: 4px; } .service-box { padding: 22px; border-radius: 27px; } .service-option { min-height: 66px; border-radius: 17px; } .grid { opacity: .07; } .grain { opacity: .035; } } @media (max-width: 360px) { #welcomeText { font-size: 26px; } .frombs-btn { min-width: 140px; padding: 12px 22px; } .service-box { padding: 19px; } } @media (min-width: 1400px) { #welcomeText { font-size: 82px; } } @media (max-height: 500px) and (orientation: landscape) { .brand-mark { display: none; } .eyebrow { margin-bottom: 10px; } #welcomeText { min-height: 45px; font-size: clamp(25px, 6vh, 42px); } #language { margin-top: 8px; } .line-wrapper { margin: 12px auto; } .frombs-btn { margin-top: 0; } .service-box { max-height: 90vh; overflow-y: auto; } } /* ========================================================= REDUCED MOTION ========================================================= */ @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } } </style> </head> <body> <!-- ======================================================= CINEMATIC BACKGROUND ======================================================== --> <div class="background"> <div class="glow"></div> <div class="glow-two"></div> <div class="glow-three"></div> <div class="grid"></div> <div class="orb"></div> <div class="orb"></div> <div class="orb"></div> <div class="orb"></div> <div class="orb"></div> <div class="orb"></div> <div class="orb"></div> </div> <div class="grain"></div> <div class="vignette"></div> <main class="welcome-container"> <div class="eyebrow"> <span></span> Private <span></span> Secure <span></span> Simple <span></span> </div> <div id="welcomeText"></div> <div id="language"></div> <div class="line-wrapper"> <div class="line"></div> <div class="diamond"></div> <div class="line right"></div> </div> </div>
  <script>

    document.addEventListener(
      "contextmenu",
      event => event.preventDefault()
    )
    const languages = [

      {
        name: "English",
        text: "Welcome to Black Swan"
      },

      {
        name: "Español",
        text: "Bienvenido a Black Swan"
      },

      {
        name: "台灣語",
        text: "歡迎來到 Black Swan"
      },

      {
        name: "Français",
        text: "Bienvenue à Black Swan"
      },

      {
        name: "Deutsch",
        text: "Willkommen bei Black Swan"
      },

      {
        name: "Русский",
        text: "Добро пожаловать в Black Swan"
      }

    ];


    const welcomeText =
      document.getElementById("welcomeText");

    const language =
      document.getElementById("language");


    let current = 0;


    /* =======================================================
       LANGUAGE ANIMATION
    ======================================================== */

    function showLanguage() {

      welcomeText.classList.remove("show");

      welcomeText.classList.add("hide");

      language.style.opacity = "0";


      setTimeout(() => {

        welcomeText.textContent =
          languages[current].text;

        language.textContent =
          languages[current].name;


        welcomeText.classList.remove("hide");

        void welcomeText.offsetWidth;

        welcomeText.classList.add("show");


        language.style.transition =
          "opacity .9s ease, transform .9s ease";

        language.style.transform =
          "translateY(0)";

        language.style.opacity =
          "1";


        current =
          (current + 1) % languages.length;

      }, 500);

    }


    showLanguage();

    setInterval(
      showLanguage,
      3200
    );


    /* =======================================================
       MODAL
    ======================================================== */

    const fromBsButton =
      document.getElementById("fromBsButton");

    const serviceOverlay =
      document.getElementById("serviceOverlay");

    const closeService =
      document.getElementById("closeService");


    function openService() {

      serviceOverlay.classList.add("active");

      document.body.style.overflow =
        "hidden";

    }


    function closeServiceMenu() {

      serviceOverlay.classList.remove("active");

      document.body.style.overflow =
        "hidden";

    }


    fromBsButton.addEventListener(
      "click",
      openService
    );


    closeService.addEventListener(
      "click",
      closeServiceMenu
    );


    serviceOverlay.addEventListener(
      "click",
      event => {

        if (
          event.target === serviceOverlay
        ) {

          closeServiceMenu();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeServiceMenu();

        }

      }
    );


    /* =======================================================
       DISABLED SERVICES MESSAGE
    ======================================================== */

    function showAccessMessage() {

      const option =
        document.getElementById(
          "accessOption"
        );

      option.animate(
        [
          {
            transform: "translateX(0)"
          },
          {
            transform: "translateX(-5px)"
          },
          {
            transform: "translateX(5px)"
          },
          {
            transform: "translateX(-3px)"
          },
          {
            transform: "translateX(0)"
          }
        ],
        {
          duration: 350,
          easing: "ease-out"
        }
      );

    }


    /* =======================================================
       SUBTLE MOUSE PARALLAX
    ======================================================== */

    const background =
      document.querySelector(".background");

    const main =
      document.querySelector(".welcome-container");


    let mouseX = 0;
    let mouseY = 0;

    let targetX = 0;
    let targetY = 0;


    window.addEventListener(
      "mousemove",
      event => {

        mouseX =
          (event.clientX / window.innerWidth - .5);

        mouseY =
          (event.clientY / window.innerHeight - .5);

      }
    );


    function animateParallax() {

      targetX +=
        (mouseX - targetX) * .025;

      targetY +=
        (mouseY - targetY) * .025;


      background.style.transform =
        `translate(${targetX * -10}px, ${targetY * -10}px)`;


      main.style.transform =
        `translate(${targetX * 3}px, ${targetY * 3}px)`;


      requestAnimationFrame(
        animateParallax
      );

    }


    animateParallax();


    /* =======================================================
       TOUCH FEEDBACK
    ======================================================== */

    fromBsButton.addEventListener(
      "touchstart",
      () => {

        fromBsButton.style.transform =
          "scale(.96)";

      },
      {
        passive: true
      }
    );


    fromBsButton.addEventListener(
      "touchend",
      () => {

        fromBsButton.style.transform =
          "";

      },
      {
        passive: true
      }
    );


  </script>

</body>
</html>
