<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BsRora | BsHelper</title>
  <link rel="icon" type="image/x-icon" href="https://i.ibb.co/27GXWVgg/BS.png">
    
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

* {
	-webkit-tap-highlight-color: transparent;
	margin: 0;
	padding: 0;
	font-family: 'Poppins', sans-serif;
    letter-spacing: 0.3px;;
}

    :root {
      --bg: #0f0f0f;
      --container: #1a1a1a;
      --header: #222;
      --bot-msg: #2a2a2a;
      --user-msg: #3b82f6;
      --text: #e5e5e5;
      --input-bg: #2a2a2a;
      --border: #333;
      --option-bg: #333;
      --link: #60a5fa;
      --font-size: 15px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;    overflow: hidden;
      transition: background 0.3s;
    }

    .chat-container {
     width: 100%;
    max-width: 100vh;
    height: 95vh;
    max-height: 550px;
    background: var(--container);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    transition: background 0.3s;
    }

    .chat-header {
      background: #ffffff33;;
      padding: 12px 16px;
      font-size: calc(var(--font-size) + 2px);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-title {
      flex: 1;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: var(--option-bg);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
::placeholder{
    color: white;
}
    .ctrl-btn:hover {
      opacity: 0.85;
    }

    .theme-select {
      background: var(--option-bg);
      color: var(--text);
      border: none;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .chat-messages {
          flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #ffffff transparent;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: var(--font-size);
      white-space: pre-wrap;
    }

    .bot {
      background: var(--bot-msg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background: #000000b3;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    border: solid 2px #ffffff42;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .options a {
      display: contents;
    }
.options p{
     display: block;
      background: var(--option-bg);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: calc(var(--font-size) - 1px);
      transition: opacity 0.2s;
      border: solid 2px #ffffff42;
}
    .options p:hover {
      border: solid 2px white;
    }

    .suggestions {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggestions button {
      background: var(--option-bg);
    color: var(--text);
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: calc(var(--font-size) - 1px);
    text-align: left;
    cursor: pointer;
    transition: opacity 0.2s;
    border: solid 2px #ffffff42;
    }

    .suggestions button:hover {
      border: solid 2px white;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      background: #ffffff33;
      border-top: 1px solid var(--border);
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: var(--input-bg);
      border: none;
      outline: none;
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: var(--font-size);
    }

    .chat-input button {
      background: black;
      border: none;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: var(--font-size);
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .chat-input button:hover {
      opacity: 0.9;
    }

    .color-popup {
          display: none;
    position: absolute;
    top: 55px;
    right: 12px;
    background: var(--container);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    width: max-content;
    }

    .color-popup.show {
      display: block;
    }

    .color-popup label {
      font-size: 13px;
      display: block;
      margin-bottom: 8px;
    }

    .color-popup input[type="color"] {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .color-popup button {
          margin-top: 10px;
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: white;
    color: black;
    cursor: pointer;
    font-size: 14px;
    }

    @media (max-width: 400px) {
      .chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      body {
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <div class="controls">
        <button class="ctrl-btn" onclick="changeFont(-1)" title="Decrease font">A-</button>
        <button class="ctrl-btn" onclick="changeFont(1)" title="Increase font">A+</button>
      </div>

      <div class="header-title">BsRora | BsHelper</div>

      <div class="controls" style="position: relative;">
        <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
          <option value="dark">Dark</option>
          <option value="night">Night</option>
          <option value="light">Light</option>
          <option value="blue">Blue</option>
          <option value="custom">Custom</option>
        </select>

        <div class="color-popup" id="colorPopup">
          <label>Pick your color</label>
          <input type="color" id="customColor" value="#1a1a1a">
          <button onclick="saveCustomColor()">Save Color</button>
        </div>
      </div>
    </div>
    
    <div class="chat-messages" id="messages">
      <div class="message bot">
How can I help you?

Click any option below:
<div class="suggestions">
  <button onclick="sendQuick('I have an issue')">I have an issue</button>
  <button onclick="sendQuick('Who can I contact for a feature?')">Who can I contact for a specific feature?</button>
  <button onclick="sendQuick('I want a different theme')">I want a different theme</button>
</div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // ===== Font Size =====
    let currentFont = 15;

    function changeFont(delta) {
      currentFont = Math.min(22, Math.max(12, currentFont + delta));
      document.documentElement.style.setProperty('--font-size', currentFont + 'px');
      localStorage.setItem('chatFontSize', currentFont);
    }

    // ===== Themes =====
    const themes = {
      dark: {
        '--bg': '#0f0f0f',
        '--container': '#1a1a1a',
        '--header': '#222',
        '--bot-msg': '#2a2a2a',
        '--user-msg': '#3b82f6',
        '--text': '#e5e5e5',
        '--input-bg': '#2a2a2a',
        '--border': '#333',
        '--option-bg': '#333',
        '--link': '#60a5fa'
      },
      night: {
        '--bg': '#050508',
        '--container': '#0d0d14',
        '--header': '#12121c',
        '--bot-msg': '#1a1a28',
        '--user-msg': '#6366f1',
        '--text': '#e0e0ff',
        '--input-bg': '#1a1a28',
        '--border': '#2a2a3d',
        '--option-bg': '#1f1f30',
        '--link': '#a5b4fc'
      },
      light: {
        '--bg': '#f0f0f0',
        '--container': '#ffffff',
        '--header': '#f5f5f5',
        '--bot-msg': '#e8e8e8',
        '--user-msg': '#2563eb',
        '--text': '#1a1a1a',
        '--input-bg': '#f0f0f0',
        '--border': '#ddd',
        '--option-bg': '#e0e0e0',
        '--link': '#1d4ed8'
      },
      blue: {
        '--bg': '#0a1628',
        '--container': '#0f2137',
        '--header': '#132d4a',
        '--bot-msg': '#1a3555',
        '--user-msg': '#0ea5e9',
        '--text': '#e0f2fe',
        '--input-bg': '#1a3555',
        '--border': '#1e3a5f',
        '--option-bg': '#1e3a5f',
        '--link': '#38bdf8'
      }
    };

    function applyTheme(themeName) {
      const theme = themes[themeName];
      if (!theme) return;

      for (const [key, value] of Object.entries(theme)) {
        document.documentElement.style.setProperty(key, value);
      }
      localStorage.setItem('chatTheme', themeName);
      document.getElementById('colorPopup').classList.remove('show');
    }

    function changeTheme(value) {
      if (value === 'custom') {
        document.getElementById('colorPopup').classList.add('show');
        const saved = localStorage.getItem('customColor');
        if (saved) {
          applyCustomColor(saved);
        }
      } else {
        applyTheme(value);
      }
    }

    function applyCustomColor(color) {
      document.documentElement.style.setProperty('--bg', shadeColor(color, -30));
      document.documentElement.style.setProperty('--container', color);
      document.documentElement.style.setProperty('--header', shadeColor(color, 15));
      document.documentElement.style.setProperty('--bot-msg', shadeColor(color, 25));
      document.documentElement.style.setProperty('--input-bg', shadeColor(color, 25));
      document.documentElement.style.setProperty('--border', shadeColor(color, 40));
      document.documentElement.style.setProperty('--option-bg', shadeColor(color, 30));
      document.documentElement.style.setProperty('--text', getContrastText(color));
      document.documentElement.style.setProperty('--link', '#60a5fa');
      document.documentElement.style.setProperty('--user-msg', '#3b82f6');
    }

    function saveCustomColor() {
      const color = document.getElementById('customColor').value;
      applyCustomColor(color);
      localStorage.setItem('customColor', color);
      localStorage.setItem('chatTheme', 'custom');
      document.getElementById('colorPopup').classList.remove('show');
    }

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1,3), 16);
      let G = parseInt(color.substring(3,5), 16);
      let B = parseInt(color.substring(5,7), 16);

      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);

      R = Math.min(255, Math.max(0, R));
      G = Math.min(255, Math.max(0, G));
      B = Math.min(255, Math.max(0, B));

      const RR = R.toString(16).padStart(2, '0');
      const GG = G.toString(16).padStart(2, '0');
      const BB = B.toString(16).padStart(2, '0');

      return "#" + RR + GG + BB;
    }

    function getContrastText(hex) {
      const r = parseInt(hex.substr(1,2), 16);
      const g = parseInt(hex.substr(3,2), 16);
      const b = parseInt(hex.substr(5,2), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? '#1a1a1a' : '#e5e5e5';
    }

    // ===== Load saved settings =====
    window.onload = function() {
      const savedFont = localStorage.getItem('chatFontSize');
      if (savedFont) {
        currentFont = parseInt(savedFont);
        document.documentElement.style.setProperty('--font-size', currentFont + 'px');
      }

      const savedTheme = localStorage.getItem('chatTheme') || 'dark';
      document.getElementById('themeSelect').value = savedTheme;

      if (savedTheme === 'custom') {
        const color = localStorage.getItem('customColor') || '#1a1a1a';
        document.getElementById('customColor').value = color;
        applyCustomColor(color);
      } else {
        applyTheme(savedTheme);
      }
    };

    // ===== Chat logic =====
    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");

    input.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    function addMessage(text, isUser = false) {
      const div = document.createElement("div");
      div.className = "message " + (isUser ? "user" : "bot");
      div.innerHTML = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = "";

      setTimeout(() => {
        const reply = getReply(text.toLowerCase());
        addMessage(reply);
      }, 400);
    }

    // Click suggestion
    function sendQuick(text) {
      addMessage(text, true);

      setTimeout(() => {
        const reply = getReply(text.toLowerCase());
        addMessage(reply);
      }, 400);
    }

    function getReply(msg) {
      if (msg.includes("issue") || msg.includes("problem") || msg.includes("bug") || msg.includes("error")) {
        return `Got it. What kind of issue are you facing?
<div class="options">
<a href="https://www.instagram.com/ramky._/">
    <p onclick="selectIssue('natural')" >Nature Issue</p>
</a> 
<a href="https://www.instagram.com/psvkry/">
    <p onclick="selectIssue('private')" >Privacy Issue</p>
</a>
<a href="https://www.instagram.com/rk.v.siva_/">
    <p onclick="selectIssue('culture')">Culture Issue</p>
</a>
</div>`;
      }

      if (msg.includes("feature") && (msg.includes("add") || msg.includes("want") || msg.includes("new") || msg.includes("specific"))) {
        return "Message rk.v.siva._ to check whether this feature can be added or not.";
      }

      if (msg.includes("contact") || (msg.includes("who") && msg.includes("feature")) || msg.includes("owner")) {
        return `We don’t add features for one specific bot.

If it’s useful for other bots too, we can work on it.

If you still want to discuss it, contact rk.v.siva._
(That’s Psvkry’s account — one of the owners who handles new features.)

Note: He’s not very active on social media and doesn’t check messages often, so just wait for his reply.`;
      }

      if (msg.includes("theme") || msg.includes("style") || msg.includes("design") || msg.includes("look")) {
        return "No Black Swan don't do any specific themes or styles.";
      }

      return "I can help with issues, feature requests, or theme questions. What do you need?";
    }
  </script>
 <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        function selectIssue(type) {
            let category = "";
            let description = "";
            if (type === 'natural') {
                category = "Nature Issue";
                description = "Public Services";
            } else if (type === 'private') {
                category = "Privacy Issue";
                description = "Private Services";
            } else if (type === 'culture') {
                category = "Culture Issue";
                description = "BsMembers";
            }
            
            alert(`You are facing an issue with our ${description}!\n\nWe will now redirect you to the instagram page. Describe the issue you experiencing.`);
        }
    </script>
</body>
</html>
