
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Black Swan | Business</title>

  <link rel="icon" type="image/x-icon"
        href="https://i.ibb.co/27GXWVgg/BS.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --bg-card: #111111;
      --bg-card-hover: #191919;
      --border: #303030;
      --text: #e8e8e8;
      --text-muted: #888888;
      --accent: #0025ff;
      --accent-soft: rgba(0, 37, 255, 0.10);
      --accent-glow: rgba(0, 37, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.65) transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 37, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 37, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
     z-index: 100;
    display: flex;
    /* flex-direction: column; */
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: #181818;
    border-bottom: 1px solid var(--border);
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    }

    .topbar img {
     width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    }

    .container {
      position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 5px;
    }

    .logo {
      padding: 15px 0 20px 0;
    font-size: 30px;
    font-weight: 600;
    text-align: center;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      padding: 15px;
      background: var(--bg-card);
      border-left: 3px solid #444;
      border-radius: 0 6px 6px 0;
      color: #cccccc;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .card h3 {
      font-size: 18px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }


    footer {
      position: relative;
    z-index: 1;
    padding: 25px 15px 20px 0;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    margin-top: 30px;
    }

      footer {
              background: black;
    padding: 19px 0;
    text-align: center;
    border-top: solid 1px #8080803d;
    margin: 20px 0 0 0;
        }

        .footer-text {
                font-size: 12px;
    color: #ffffff6e;
    margin-bottom: 8px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 12px;
        }

        .footer-links a {
               color: #ffffff85;
    font-size: 14px;
    text-decoration: none;
    transition: color 0.15s ease;
        }

        .footer-links a:hover {
            color: white;
            text-decoration: underline;
        }
    @media (max-width: 480px) {
      .logo {
        font-size: 26px;
      }

      .card {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <!-- <img src="BS.png" alt="Black Swan logo"> -->
    <span>Black Swan Organization</span>
  </div>

  <main>

    <!-- Black Swan services -->
    <section class="container">
      <header>
        <h1 class="logo">BS</h1>
      </header>

      <div class="cards">
        <a href="https://blackswan19.github.io/bscrop/formbs">
          <div class="card">
            <h3>FromBS</h3>
          </div>
        </a>

        <a href="https://blackswan19.github.io/BS/efiles">
          <div class="card">
            <h3>Efiles</h3>
          </div>
        </a>

        <a href="https://blackswan19.github.io/BS/bs.rora">
          <div class="card">
            <h3>BsRora</h3>
          </div>
        </a>
      </div>
    </section>

    <!-- Myootive services -->
    <section class="container">
      <header>
        <h2 class="logo">Myootive</h2>
      </header>

      <div class="cards">
        <a href="https://blackswan19.github.io/bscrop/frommyootive">
          <div class="card">
            <h3>From Myootive</h3>
          </div>
        </a>

        <a href="https://blackswan19.github.io/BS/vsl">
          <div class="card">
            <h3>VSL</h3>
          </div>
        </a>
      </div>
    </section>

    <!-- Patron in services -->
    <section class="container">
      <header>
        <h2 class="logo">Patron</h2>
      </header>

      <div class="cards">
        <a href="https://blackswan19.github.io/BS/bs.dev.tol">
          <div class="card">
            <h3>BsDevTol</h3>
          </div>
        </a>

        <a href="https://blackswan19.github.io/BS/bs&amp;mfi">
          <div class="card">
            <h3>BS&amp;MFI</h3>
          </div>
        </a>
      </div>
      <footer>
        <p class="footer-text">Powered by Black Swan</p>
        <div class="footer-links">
            <a href="https://blackswan19.github.io/bscrop/termsofuse">Terms Of Uses</a>
        </div>
    </footer>
    </section>
  </main>
<!-- <script>document.addEventListener('contextmenu', e => e.preventDefault());</script> -->
</body>
</html>
