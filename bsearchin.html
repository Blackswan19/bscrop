    <script>
        let currentBg = localStorage.getItem('backgroundImage') || localStorage.getItem('bsBackground') || '';
        let currentColor = localStorage.getItem('bsBackgroundColor') || '#0a0f1c';
document.addEventListener('contextmenu', e => e.preventDefault());
        function applyBackground() {
            const container = document.getElementById('bgContainer');
            if (currentBg) {
                container.style.backgroundImage = `url('${currentBg}')`;
                container.style.backgroundColor = '';
            } else {
                container.style.backgroundImage = '';
                container.style.backgroundColor = currentColor;
            }
        }

        function updateImageBackground(src) {
            currentBg = src;
            localStorage.setItem('backgroundImage', src);
            localStorage.setItem('bsBackground', src);
            localStorage.removeItem('bsBackgroundColor');
            applyBackground();
        }

        function updateColorBackground(color) {
            currentColor = color;
            currentBg = '';
            localStorage.setItem('bsBackgroundColor', color);
            localStorage.removeItem('backgroundImage');
            localStorage.removeItem('bsBackground');
            applyBackground();
        }

        function removeBackground() {
            if (confirm("Reset background?")) {
                currentBg = '';
                currentColor = '#0a0f1c';
                localStorage.removeItem('backgroundImage');
                localStorage.removeItem('bsBackground');
                localStorage.removeItem('bsBackgroundColor');
                applyBackground();
            }
        }

        function pickColorBackground() {
            const input = document.createElement('input');
            input.type = 'color';
            input.value = currentColor;
            input.onchange = e => updateColorBackground(e.target.value);
            input.click();
            document.getElementById('settingsMenu').style.display = 'none';
        }

        function loadToolbarPosition() {
            const toolbar = document.getElementById('toolbar');
            if (localStorage.getItem('toolbarBottom') === 'true') {
                toolbar.classList.add('bottom');
            }
            updateBottomLinksPosition();
        }

        function toggleToolbarPosition() {
            const toolbar = document.getElementById('toolbar');
            const isBottom = toolbar.classList.toggle('bottom');
            localStorage.setItem('toolbarBottom', isBottom);
            document.getElementById('settingsMenu').style.display = 'none';
            updateBottomLinksPosition();
        }

        function updateBottomLinksPosition() {
            const bottomLinks = document.getElementById('bottomLinks');
            const toolbar = document.getElementById('toolbar');
            if (toolbar.classList.contains('bottom')) {
                bottomLinks.style.top = 'auto';
                bottomLinks.style.bottom = '15px';
            } else {
                bottomLinks.style.top = '15px';
                bottomLinks.style.bottom = 'auto';
            }
        }

        let favorites = JSON.parse(localStorage.getItem('websites') || localStorage.getItem('bsFavorites') || '[]');

        function saveFavorites() {
            localStorage.setItem('websites', JSON.stringify(favorites));
            localStorage.setItem('bsFavorites', JSON.stringify(favorites));
        }

        function renderFavorites() {
            const grid = document.getElementById('favorites-grid');
            grid.innerHTML = favorites.length === 0 
                ? `<div onclick="addNewSite()" style="    color: #ffffff94;
    text-align: center;
    font-size: 15px;
    width: 100%;
    font-weight: 200;
    line-height: 30px;">No Site Saved yet.<br>Click here to save a site..!</div>`
                : '';

            favorites.forEach((fav, index) => {
                const div = document.createElement('div');
                div.className = 'favorite-item';
                const domain = fav.url ? new URL(fav.url).hostname : '';
                div.innerHTML = `
                    <div class="fav-icon">
                        <img src="https://www.google.com/s2/favicons?domain=${domain}" onerror="this.src='https://i.ibb.co/kxgjrZG/sitesaved-BS.png'">
                    </div>
                    <div class="fav-title">${fav.title || domain}</div>
                    <div class="delete-fav" onclick="event.stopImmediatePropagation(); deleteFavorite(${index});">×</div>
                `;
                div.onclick = () => window.open(fav.url, '_self');
                grid.appendChild(div);
            });
        }

        function deleteFavorite(index) {
            if (confirm("Delete this favorite?")) {
                favorites.splice(index, 1);
                saveFavorites();
                renderFavorites();
            }
        }

        function addNewSite() {
            document.getElementById('addSitePopup').style.display = 'block';
            document.getElementById('settingsMenu').style.display = 'none';
        }

        function hideAddPopup() {
            document.getElementById('addSitePopup').style.display = 'none';
        }

        function saveNewSite() {
            const title = document.getElementById('siteTitle').value.trim();
            let url = document.getElementById('siteURL').value.trim();
            if (!title || !url) return alert("Title and URL required");
            if (!url.startsWith('http')) url = 'https://' + url;

            favorites.unshift({ title, url });
            saveFavorites();
            renderFavorites();
            hideAddPopup();
        }

        // ========== SEARCH HISTORY ==========
        let storedInputs = JSON.parse(localStorage.getItem('storedInputs') || '[]');
        let selectedSuggestionIndex = -1;

        function saveSearchHistory() {
            localStorage.setItem('storedInputs', JSON.stringify(storedInputs));
        }

        function updateClearButton() {
            const clearBtn = document.getElementById('clearBtn');
            const urlBar = document.getElementById('url-bar');
            clearBtn.style.display = urlBar.value.trim() ? 'block' : 'none';
        }

        function showSuggestions(value) {
            const suggestionsEl = document.getElementById('suggestions');
            suggestionsEl.innerHTML = '';
            selectedSuggestionIndex = -1;

            const filtered = value
                ? storedInputs.filter(item => item.toLowerCase().includes(value.toLowerCase()))
                : [...storedInputs];

            if (filtered.length === 0) {
                suggestionsEl.style.display = 'none';
                return;
            }

            filtered.forEach((suggestion) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'suggestion-text';
                textSpan.textContent = suggestion;

                const delSpan = document.createElement('span');
                delSpan.className = 'delete-suggestion';
                delSpan.textContent = '✕';
                delSpan.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    deleteSuggestion(suggestion);
                });

                div.appendChild(textSpan);
                div.appendChild(delSpan);

                div.addEventListener('click', () => {
                    document.getElementById('url-bar').value = suggestion;
                    updateClearButton();
                    suggestionsEl.style.display = 'none';
                    performSearch(suggestion);
                });

                suggestionsEl.appendChild(div);
            });
            suggestionsEl.style.display = 'block';
        }

        function deleteSuggestion(suggestion) {
            const index = storedInputs.indexOf(suggestion);
            if (index > -1) {
                storedInputs.splice(index, 1);
                saveSearchHistory();
                const value = document.getElementById('url-bar').value;
                showSuggestions(value);
            }
        }

        function updateSuggestionHighlight() {
            const items = document.querySelectorAll('#suggestions .suggestion-item');
            items.forEach((item, i) => {
                if (i === selectedSuggestionIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function performSearch(query) {
            query = query.trim();
            if (!query) return;

            // Always move the searched query to the top (most recent)
            const existingIndex = storedInputs.indexOf(query);
            if (existingIndex > -1) {
                storedInputs.splice(existingIndex, 1);
            }
            storedInputs.unshift(query);
            if (storedInputs.length > 30) storedInputs.pop();
            saveSearchHistory();

            if (query.includes('.') && !query.includes(' ')) {
                window.location.href = query.startsWith('http') ? query : 'https://' + query;
            } else {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        function toggleSettings(e) {
    if (e) e.stopPropagation();

    const menu = document.getElementById('settingsMenu');
    const btn = document.getElementById('settingsBtn');

    const isVisible = menu.style.display === 'block';

    if (isVisible) {
        menu.style.display = 'none';
        return;
    }

    // Position the menu relative to the Settings button
    const btnRect = btn.getBoundingClientRect();
    const toolbar = document.getElementById('toolbar');
    const isBottom = toolbar.classList.contains('bottom');

    menu.style.position = 'fixed';
    menu.style.right = (window.innerWidth - btnRect.right) + 'px';
    
    if (isBottom) {
        // Toolbar is at top → show menu below the button
        menu.style.top = (btnRect.bottom + 10) + 'px';
        menu.style.bottom = 'auto';
    } else {
        // Toolbar is at bottom → show menu above the button
        menu.style.bottom = (window.innerHeight - btnRect.top + 10) + 'px';
        menu.style.top = 'auto';
    }

    menu.style.display = 'block';
}

// ========== NEW BUTTON FUNCTIONS ==========
function copyUrlBar() {
    const urlBar = document.getElementById('url-bar');
    const text = urlBar.value.trim();

    if (!text) {
        // subtle feedback
        urlBar.placeholder = "Nothing to copy";
        setTimeout(() => urlBar.placeholder = "Enter your query here...", 1200);
        return;
    }

    // Modern way
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
            showCopyFeedback();
        }).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.left = '-9999px';
    temp.style.top = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();

    try {
        document.execCommand('copy');
        showCopyFeedback();
    } catch (err) {
        alert("Copy failed");
    }

    document.body.removeChild(temp);
}

function showCopyFeedback() {
    const urlBar = document.getElementById('url-bar');
    const original = urlBar.placeholder;
    urlBar.placeholder = "Copied!";
    setTimeout(() => {
        urlBar.placeholder = original;
    }, 1200);
}

async function pasteToUrlBar() {
    try {
        const text = await navigator.clipboard.readText();
        const urlBar = document.getElementById('url-bar');
        urlBar.value = text;
        updateClearButton();
        showSuggestions(text.trim());
        urlBar.focus();
    } catch (err) {
        alert("Allow clipboard paste access.");
    }
}

function clearAllHistory() {
    if (confirm("Delete all search history?")) {
        storedInputs = [];
        saveSearchHistory();
        document.getElementById('suggestions').style.display = 'none';
        document.getElementById('url-bar').value = '';
        updateClearButton();
    }
}

        function uploadBackground() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 15 * 1024 * 1024) {
                    alert("Image is too large. Choose an image under 15MB.");
                    return;
                }

                document.getElementById('settingsMenu').style.display = 'none';

                const originalPlaceholder = document.getElementById('url-bar').placeholder;
                document.getElementById('url-bar').placeholder = "Processing image...";
                
                const reader = new FileReader();
                
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1920;
                        
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round(height * maxDim / width);
                                width = maxDim;
                            } else {
                                width = Math.round(width * maxDim / height);
                                height = maxDim;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        
                        updateImageBackground(compressedDataUrl);
                        document.getElementById('url-bar').placeholder = originalPlaceholder;
                    };
                    
                    img.onerror = () => {
                        alert("Failed to load image.");
                        document.getElementById('url-bar').placeholder = originalPlaceholder;
                    };
                    
                    img.src = ev.target.result;
                };
                
                reader.onerror = () => {
                    alert("Error reading file.");
                    document.getElementById('url-bar').placeholder = originalPlaceholder;
                };
                
                reader.readAsDataURL(file);
            };
            
            input.click();
        }

        const recommendedBGs = [
            "backgrounds/1.jpg",
            "backgrounds/2.jpg",
            "backgrounds/4.jpg",
            "backgrounds/5.jpg",
            "backgrounds/6.avif",
            "backgrounds/8.avif",
            "backgrounds/9.avif",
            "backgrounds/11.jpg",
        ];

        function showRecommendedBGs() {
            const grid = document.getElementById('bgGrid');
            grid.innerHTML = '';
            recommendedBGs.forEach(src => {
                const div = document.createElement('div');
                div.style.height = '118px';
                div.style.borderRadius = '12px';
                div.style.background = `url('${src}') center/cover`;
                div.style.cursor = 'pointer';
                div.onclick = () => { updateImageBackground(src); hideBGPpopup(); };
                grid.appendChild(div);
            });
            document.getElementById('bgPopup').style.display = 'block';
            document.getElementById('settingsMenu').style.display = 'none';
        }

        function hideBGPpopup() {
            document.getElementById('bgPopup').style.display = 'none';
        }

        const urlBar = document.getElementById('url-bar');
        const suggestionsEl = document.getElementById('suggestions');
        const searchIcon = document.getElementById('searchIcon');
        const clearBtn = document.getElementById('clearBtn');

        // Clear button – shows whenever there is any text
        clearBtn.addEventListener('click', () => {
            urlBar.value = '';
            updateClearButton();
            urlBar.focus();
            showSuggestions('');
        });

        searchIcon.addEventListener('click', () => {
            const query = urlBar.value.trim();
            if (query) performSearch(query);
            else urlBar.focus();
        });
        
        urlBar.addEventListener('input', () => {
            updateClearButton();
            showSuggestions(urlBar.value.trim());
        });

        urlBar.addEventListener('focus', () => {
            showSuggestions(urlBar.value.trim());
        });

        // Keyboard navigation (↑ ↓) + Enter
        urlBar.addEventListener('keydown', (e) => {
            const items = suggestionsEl.querySelectorAll('.suggestion-item');
            const isOpen = suggestionsEl.style.display === 'block' && items.length > 0;

            if (e.key === 'ArrowDown') {
                if (!isOpen) {
                    showSuggestions(urlBar.value.trim());
                    return;
                }
                e.preventDefault();
                selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
                updateSuggestionHighlight();
            }
            else if (e.key === 'ArrowUp') {
                if (!isOpen) return;
                e.preventDefault();
                selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                updateSuggestionHighlight();
            }
            else if (e.key === 'Enter') {
                e.preventDefault();
                if (isOpen && selectedSuggestionIndex >= 0) {
                    const text = items[selectedSuggestionIndex].querySelector('.suggestion-text').textContent;
                    urlBar.value = text;
                    updateClearButton();
                    suggestionsEl.style.display = 'none';
                    performSearch(text);
                } else {
                    const value = urlBar.value.trim();
                    if (value) performSearch(value);
                }
            }
            else if (e.key === 'Escape') {
                suggestionsEl.style.display = 'none';
                selectedSuggestionIndex = -1;
            }
        });

        document.addEventListener('click', e => {
    if (!e.target.closest('.address-bar-container') && !e.target.closest('#suggestions')) {
        suggestionsEl.style.display = 'none';
        selectedSuggestionIndex = -1;
    }
    if (!e.target.closest('#settingsMenu') && !e.target.closest('.fa-grip-lines') && !e.target.closest('#settingsBtn')) {
        document.getElementById('settingsMenu').style.display = 'none';
    }
});

        let cropperInstance = null;

        function openImageCropper() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 20 * 1024 * 1024) {
                    alert("Select an image smaller than 20MB");
                    return;
                }

                document.getElementById('settingsMenu').style.display = 'none';

                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.getElementById('cropperImage');
                    img.src = ev.target.result;
                    
                    document.getElementById('cropperPopup').style.display = 'flex';

                    if (cropperInstance) cropperInstance.destroy();

                    cropperInstance = new Cropper(img, {
                        aspectRatio: NaN,         
                        viewMode: 1,
                        autoCropArea: 0.8,
                        movable: true,
                        zoomable: true,
                        rotatable: true,
                        scalable: true,
                        background: false,
                        center: true,
                    });
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function applyCroppedBackground() {
            if (!cropperInstance) return;

            const croppedCanvas = cropperInstance.getCroppedCanvas({
                maxWidth: 1920,
                maxHeight: 1080,
                imageSmoothingQuality: 'high'
            });

            const croppedDataUrl = croppedCanvas.toDataURL('image/jpeg', 0.88);
            
            updateImageBackground(croppedDataUrl);
            cancelCrop();
        }

        function cancelCrop() {
            const popup = document.getElementById('cropperPopup');
            popup.style.display = 'none';
            
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
        }

        window.onload = () => {
            applyBackground();
            loadToolbarPosition();
            renderFavorites();
            updateClearButton();
            setTimeout(() => {
                document.getElementById('url-bar').focus();
            }, 300);
        };
    </script>
</body>
</html>
